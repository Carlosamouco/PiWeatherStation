services:
  database:
    build:
      context: ./database
      args:
        ARCH_DB: ${ARCH_DB}
    volumes:
      - ./database/.pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    env_file:
      - ./database/.env

  pgadmin:
    build:
      context: ./pgadmin
      args:
        ARCH_PGADMIN: ${ARCH_PGADMIN}
    volumes:
      - ./pgadmin:/data
    ports:
      - "5050:5050"
    env_file:
      - ./pgadmin/.env
    links:
      - database:postgres

  client:
    build:
      context: ./client
      target: ${BUILD_TARGET}
      args:
        ARCH_NODE: ${ARCH_NODE}
    volumes:
      - ./client:/app
    ports:
      - "4200:4200"
    links:
      - server

  server:
    build:
      context: ./server
      target: ${BUILD_TARGET}
      args:
        ARCH_NODE: ${ARCH_NODE}
    volumes:
      - ./server/src:/app
    ports:
      - "3333:3333"
    links:
      - database:postgres

  nginx:
    build:
      context: ./nginx
      args:
        ARCH_NGINX: ${ARCH_NGINX}
    ports:
      - "80:80"
    links:
      # - client
      - server
